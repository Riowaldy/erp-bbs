<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ERP Bama Bumi Sentosa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: web = navy sidebar + scrolling work area; mobile = phone frame with bottom tab bar and bottom sheets. */
:root{
  --bg:#edf1f5; --surface:#ffffff; --surface-2:#f4f7fa; --line:#d9e1e9; --line-2:#e7edf2;
  --ink:#0e2132; --ink-2:#465a6d; --ink-3:#7a8a9a;
  --brand:#1b5b95; --brand-2:#2f7cc0; --brand-soft:#e2ecf6; --brand-ink:#ffffff;
  --signal:#d62b33; --logo:#1b5b95;
  --side:#0d2740; --side-2:#123352; --side-ink:#cfdeec; --side-ink-2:#7f9bb6;
  --good:#1d8a58; --warn:#c2810f; --crit:#d62b33;
  --c-op:#1d8a58; --c-sb:#2f7cc0; --c-md:#7454c2; --c-bd:#d62b33; --c-ib:#7d8b98; --c-rc:#c2810f;
  --shadow:0 1px 2px rgba(13,39,64,.06),0 6px 20px -8px rgba(13,39,64,.18);
  --f-disp:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#09131d; --surface:#0f1c29; --surface-2:#142434; --line:#213447; --line-2:#1a2b3c;
  --ink:#e4edf5; --ink-2:#a3b4c5; --ink-3:#71859a;
  --brand:#4f98da; --brand-2:#79b3e8; --brand-soft:#15304a; --brand-ink:#06121e;
  --signal:#ff5c63; --logo:#79b3e8;
  --side:#060f18; --side-2:#0e1e2e; --side-ink:#c9d8e6; --side-ink-2:#6e8aa4;
  --good:#3fc185; --warn:#e6a93a; --crit:#ff5c63;
  --c-op:#3fc185; --c-sb:#5ea9ea; --c-md:#a48af0; --c-bd:#ff5c63; --c-ib:#8696a6; --c-rc:#e6a93a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09131d; --surface:#0f1c29; --surface-2:#142434; --line:#213447; --line-2:#1a2b3c;
  --ink:#e4edf5; --ink-2:#a3b4c5; --ink-3:#71859a;
  --brand:#4f98da; --brand-2:#79b3e8; --brand-soft:#15304a; --brand-ink:#06121e;
  --signal:#ff5c63; --logo:#79b3e8;
  --side:#060f18; --side-2:#0e1e2e; --side-ink:#c9d8e6; --side-ink-2:#6e8aa4;
  --good:#3fc185; --warn:#e6a93a; --crit:#ff5c63;
  --c-op:#3fc185; --c-sb:#5ea9ea; --c-md:#a48af0; --c-bd:#ff5c63; --c-ib:#8696a6; --c-rc:#e6a93a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
#root{height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{font-family:var(--f-disp);margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-size:.86em;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.ic{flex:none;display:block}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px;border-radius:6px}

/* ---------- Buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;font-weight:600;font-size:14px;transition:transform .15s,background .2s,border-color .2s,box-shadow .2s;white-space:nowrap}
.btn:hover{border-color:var(--brand-2);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);box-shadow:0 6px 16px -8px var(--brand)}
.btn.pri:hover{background:var(--brand-2);border-color:var(--brand-2)}
.btn.danger{background:var(--crit);border-color:var(--crit);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2);border-color:var(--line)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;pointer-events:none}
.ibtn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--ink-2);transition:background .2s,color .2s}
.ibtn:hover{background:var(--surface-2);color:var(--ink);border-color:var(--line)}
.ibtn.del:hover{color:var(--crit)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2)}
label.f.full{grid-column:1/-1}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:15px;font-weight:500;color:var(--ink);transition:border-color .2s,box-shadow .2s}
.inp:focus{outline:none;border-color:var(--brand-2);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand-2) 20%,transparent)}
textarea.inp{min-height:84px;resize:vertical}
.inp[readonly]{background:var(--surface-2);color:var(--ink-2)}
.search{position:relative;flex:1;min-width:180px;max-width:360px}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search .inp{padding-left:38px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;transition:background .2s,color .2s}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--ink-2);transition:all .2s}
.chip:hover{border-color:var(--brand-2);color:var(--ink)}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}

/* ---------- Status ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:99px;font-size:12.5px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.pill.live i{animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 60%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.code{display:inline-grid;place-items:center;min-width:30px;height:22px;padding:0 6px;border-radius:6px;font-family:var(--f-mono);font-size:11.5px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);border:1px solid color-mix(in srgb,var(--c) 30%,transparent)}
.strip{display:flex;gap:2px}
.strip span{width:8px;height:18px;border-radius:2px;background:var(--c);opacity:.85;transition:transform .2s}
.strip span:hover{transform:scaleY(1.25)}
.strip.lg span{flex:1;width:auto;height:30px;border-radius:3px}
.bar{height:8px;background:var(--line-2);border-radius:99px;overflow:hidden;position:relative}
.bar b{display:block;height:100%;border-radius:99px;background:var(--c,var(--brand));transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}

/* ---------- Login ---------- */
.login{min-height:100%;display:grid;grid-template-columns:1.05fr 1fr;background:var(--surface)}
.login-art{position:relative;overflow:hidden;background:var(--side);color:var(--side-ink);padding:44px;display:flex;flex-direction:column;justify-content:space-between;gap:28px}
.login-art::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--side-2) 1px,transparent 1px),linear-gradient(90deg,var(--side-2) 1px,transparent 1px);background-size:36px 36px;opacity:.7;mask-image:radial-gradient(circle at 70% 40%,#000 0,transparent 75%)}
.login-art>*{position:relative}
.login-art h1{font-size:clamp(30px,3.4vw,46px);line-height:1.05;color:#fff;font-stretch:112%;font-weight:800;max-width:14ch}
.login-art p{color:var(--side-ink-2);max-width:42ch;margin:14px 0 0;font-size:16px}
.gauge-wrap{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.gauge{width:210px;max-width:100%}
.gauge .needle{transform-origin:110px 110px;animation:needle 5s ease-in-out infinite alternate}
@keyframes needle{0%{transform:rotate(-62deg)}35%{transform:rotate(18deg)}60%{transform:rotate(8deg)}100%{transform:rotate(34deg)}}
.flow path.f{stroke-dasharray:8 10;animation:flow 1.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-36}}
.readouts{display:grid;gap:10px;font-family:var(--f-mono);font-size:12.5px}
.readouts div{display:flex;gap:10px;align-items:center;color:var(--side-ink)}
.readouts span{color:var(--side-ink-2);min-width:94px}
.login-form{display:flex;align-items:center;justify-content:center;padding:40px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));position:relative}
.login-card{width:min(400px,100%);display:flex;flex-direction:column;gap:18px;animation:viewIn .6s cubic-bezier(.2,.8,.2,1)}
.login-card h2{font-size:28px;font-stretch:108%}
.demo{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.demo button{text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:11px;padding:9px 11px;display:flex;flex-direction:column;gap:1px;transition:all .2s}
.demo button:hover{border-color:var(--brand-2);transform:translateY(-2px);box-shadow:var(--shadow)}
.demo b{font-size:13.5px} .demo small{color:var(--ink-3);font-size:12px}
.err{color:var(--crit);font-size:13.5px;font-weight:600;min-height:1.2em}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.topright{position:absolute;top:18px;right:max(18px,env(safe-area-inset-right,0px));display:flex;gap:8px;z-index:5}

/* ---------- Web shell ---------- */
.shell{position:relative;height:100%;overflow:hidden}
.shell.w{display:grid;grid-template-columns:256px minmax(0,1fr)}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:18px;padding:20px 14px;overflow:auto}
.side .brand{display:flex;align-items:center;gap:10px;padding:2px 8px 6px}
.side .brand small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--side-ink-2);font-weight:600}
.side .brand b{font-family:var(--f-disp);font-stretch:110%;font-size:15px;color:#fff}
.nav-g{display:flex;flex-direction:column;gap:2px}
.nav-g>small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--side-ink-2);padding:0 10px 6px;font-weight:600}
.nav{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;border:0;background:transparent;color:var(--side-ink);font-weight:600;font-size:14.5px;text-align:left;position:relative;transition:background .2s,color .2s}
.nav:hover{background:var(--side-2);color:#fff}
.nav.on{background:linear-gradient(90deg,color-mix(in srgb,var(--brand-2) 34%,transparent),color-mix(in srgb,var(--brand-2) 8%,transparent));color:#fff}
.nav.on::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--signal)}
.nav .badge{margin-left:auto;font-size:11.5px;font-weight:700;background:var(--signal);color:#fff;border-radius:99px;padding:1px 7px}
.side-foot{margin-top:auto;border-top:1px solid var(--side-2);padding:14px 8px 0;font-size:12.5px;color:var(--side-ink-2);display:grid;gap:4px}
.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px 28px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(12px);flex-wrap:wrap}
.top h1{font-size:20px;font-stretch:108%}
.top .crumb{font-size:12.5px;color:var(--ink-3)}
.top .sp{flex:1}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border:0;flex:none}
.userbtn{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 12px 3px 3px;text-align:left}
.userbtn b{font-size:13.5px;display:block;line-height:1.1}.userbtn small{font-size:11.5px;color:var(--ink-3)}
.menu{position:absolute;right:16px;top:62px;z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;min-width:230px;animation:pop .2s cubic-bezier(.2,.8,.2,1)}
.menu button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;padding:9px 10px;border-radius:9px;font-weight:600;font-size:14px;text-align:left}
.menu button:hover{background:var(--surface-2)}
.menu .who{padding:10px;border-bottom:1px solid var(--line);margin-bottom:4px}
.scroll{flex:1;overflow:auto;overscroll-behavior:contain}
.view{padding:26px 28px 56px;max-width:1440px;margin:0 auto;animation:viewIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rowin{animation:rowIn .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(min(var(--i,0),18) * 28ms)}
@keyframes rowIn{from{opacity:0;transform:translateY(8px)}}

/* ---------- Page parts ---------- */
.ph{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.ph h2{font-size:26px;font-stretch:110%;font-weight:800}
.ph p{margin:4px 0 0;color:var(--ink-2)}
.ph .sp{flex:1}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:16px 18px 6px;flex-wrap:wrap}
.card-h h3{font-size:16px;font-stretch:106%;font-weight:700}
.card-h .sp{flex:1}
.card-b{padding:12px 18px 18px}
.tblw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
th.num{text-align:right}
td{padding:12px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr{cursor:pointer;transition:background .15s}
tbody tr:hover{background:color-mix(in srgb,var(--brand-soft) 55%,transparent)}
tbody tr:last-child td{border-bottom:0}
.cm{display:flex;flex-direction:column;gap:1px;min-width:0}
.cm b{font-weight:600}
.cm span{color:var(--ink-3);font-size:12.5px}
.acts{display:flex;gap:2px;justify-content:flex-end}
.sub{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.empty{padding:40px 20px;text-align:center;color:var(--ink-3)}
.more{display:flex;justify-content:center;padding:14px}
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;background:color-mix(in srgb,var(--warn) 11%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);margin-bottom:14px}
.banner .ic{color:var(--warn);margin-top:2px}
.banner b{display:block}
.banner .chips{margin-top:8px}

/* ---------- Dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:16px}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;transition:transform .25s,box-shadow .25s}
.kpi:hover{transform:translateY(-3px)}
.kpi small{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.kpi .v{font-family:var(--f-disp);font-size:28px;font-weight:800;font-stretch:108%;font-variant-numeric:tabular-nums;line-height:1.05}
.kpi .d{font-size:13px;color:var(--ink-2)}
.kpi .glyph{position:absolute;right:14px;top:14px;color:var(--brand-2);opacity:.6}
.kpi.alert .v{color:var(--crit)}
.kpi.btnlike{cursor:pointer}
.ring{display:flex;gap:14px;align-items:center}
.ring svg circle.p{transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.grid2{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.grid2.even{grid-template-columns:repeat(2,minmax(0,1fr))}
.chartbox{position:relative;height:280px}
.chartbox.sm{height:220px}
.dlist{display:flex;flex-direction:column;gap:2px;max-height:280px;overflow:auto}
.drow{display:flex;gap:10px;align-items:center;padding:9px 6px;border-radius:9px;border:0;background:transparent;text-align:left;width:100%}
.drow:hover{background:var(--surface-2)}
.drow .cm{flex:1}
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.jobc{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2);text-align:left;transition:transform .2s,border-color .2s}
.jobc:hover{transform:translateY(-2px);border-color:var(--brand-2)}
.jobc .top-l{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.jobc .day{font-family:var(--f-disp);font-size:30px;font-weight:800;font-stretch:110%;line-height:1;font-variant-numeric:tabular-nums}
.jobc .day small{font-size:12px;font-family:var(--f-body);font-weight:600;color:var(--ink-3);display:block;letter-spacing:.06em;text-transform:uppercase}
.jobc .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);gap:8px}
.donut-c{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;text-align:center}
.donut-c b{font-family:var(--f-disp);font-size:30px;font-weight:800;display:block;line-height:1}
.donut-c small{color:var(--ink-3);font-size:12px}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;margin-top:10px}
.legend button{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:5px 6px;border-radius:8px;font-size:13px;text-align:left}
.legend button:hover{background:var(--surface-2)}
.legend button b{margin-left:auto;font-variant-numeric:tabular-nums}
.health{display:flex;flex-direction:column;gap:14px}
.health .hrow{display:grid;gap:6px;cursor:pointer;padding:6px;border-radius:10px}
.health .hrow:hover{background:var(--surface-2)}
.health .hl{display:flex;justify-content:space-between;gap:10px;font-size:14px;flex-wrap:wrap}
.note{font-size:12.5px;color:var(--ink-3);padding:0 18px 16px}
.formula{font-family:var(--f-mono);font-size:12px;background:var(--surface-2);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;color:var(--ink-2);margin:0 18px 16px}

/* ---------- Overlay (modal / drawer / sheet) ---------- */
.ov{position:absolute;inset:0;z-index:60;background:rgba(5,14,24,.48);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:18px;width:min(680px,100%);max-height:calc(100% - 24px);display:flex;flex-direction:column;box-shadow:0 30px 60px -20px rgba(0,0,0,.45);animation:pop .3s cubic-bezier(.2,.9,.25,1.1)}
.dlg.sm{width:min(440px,100%)}

@keyframes navIn{from{opacity:.2;transform:translateX(36px)}}
@keyframes navBack{from{opacity:.2;transform:translateX(-36px)}}
.crewm{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.crewm .big{font-family:var(--f-disp);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.crewm .big small{font-size:14px;color:var(--ink-3);font-weight:600}
.ap td.cnote{white-space:normal;min-width:190px}
.rseg{padding:2px}.rseg button{padding:4px 10px;font-size:12px}
/* ---------- Aplikasi mobile BBS Kru ---------- */
.mapp{background:var(--bg);display:flex;flex-direction:column;overflow:hidden;position:relative}
.ma-body{flex:1;overflow:auto;overflow-x:hidden;padding:4px 16px 112px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.ma-body>*{flex-shrink:0}
.ma-body.slide-r{animation:slideR .42s cubic-bezier(.2,.8,.2,1)}
.ma-body.slide-l{animation:slideLf .42s cubic-bezier(.2,.8,.2,1)}
@keyframes slideR{from{opacity:0;transform:translateX(26px)}}
@keyframes slideLf{from{opacity:0;transform:translateX(-26px)}}
.ma-title{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:8px 2px 0}
.ma-title h2{font-size:26px;font-weight:800;font-stretch:110%}
.ma-title p{margin:2px 0 0;color:var(--ink-3);font-size:13.5px}
.mo-off{display:flex;gap:8px;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:#5a3d00;background:linear-gradient(90deg,#f7c766,#f2b13b);padding:6px 12px;animation:slideDown .35s cubic-bezier(.2,.8,.2,1)}
@keyframes slideDown{from{transform:translateY(-100%)}}

/* hero */
.mh2{position:relative;overflow:hidden;border-radius:26px;padding:16px 16px 18px;color:#fff;background:radial-gradient(120% 90% at 100% 0,#2f7cc0 0,transparent 55%),linear-gradient(160deg,#0d2740 0%,#123b63 60%,#1b5b95 100%);box-shadow:0 22px 40px -22px #0d2740;isolation:isolate}
.mh2-grid{position:absolute;inset:0;z-index:-1;opacity:.35;background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:22px 22px;mask-image:linear-gradient(180deg,#000,transparent 85%);animation:gridMove 18s linear infinite}
@keyframes gridMove{to{background-position:0 22px,22px 0}}
.mh2::after{content:"";position:absolute;width:220px;height:220px;right:-80px;top:-90px;border-radius:50%;border:1px solid rgba(255,255,255,.14);box-shadow:0 0 0 26px rgba(255,255,255,.04),0 0 0 54px rgba(255,255,255,.03);z-index:-1;animation:orb 9s ease-in-out infinite alternate}
@keyframes orb{to{transform:translate(-14px,10px) scale(1.06)}}
.mh2-top{display:flex;align-items:center;gap:10px}
.mh2-top .avatar{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);width:40px;height:40px}
.mh2-top .cm small{color:rgba(255,255,255,.7);font-size:12.5px}
.mh2-top .cm b{font-family:var(--f-disp);font-size:17px;font-weight:800;color:#fff}
.mh2-net{margin-left:auto;display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);color:#bff3d8;border-radius:99px;padding:5px 10px;font-size:12px;font-weight:700}
.mh2-net.off{color:#ffd88a}
.mh2-clock{margin-top:18px;display:flex;flex-direction:column;gap:2px}
.mh2-clock b{font-family:var(--f-disp);font-size:54px;line-height:.95;font-weight:800;font-stretch:115%;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mh2-clock span{color:rgba(255,255,255,.75);font-size:14px}
.mh2-plan{margin-top:12px;display:inline-flex;align-items:center;gap:8px;max-width:100%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:99px;padding:5px 12px 5px 6px;font-size:13px;font-weight:600}
.mh2-plan span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mh2-plan .code{--c:#fff!important;color:#fff;background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.35)}
.mh2-since{margin-top:14px;font-size:13px;color:rgba(255,255,255,.8)}
.mh2-since b{color:#fff}
.mh2-done{margin-top:16px;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:18px;padding:12px 14px}
.mh2-done b{display:block;font-size:15px}
.mh2-done span{font-size:13px;color:rgba(255,255,255,.75)}
.mh2-done .ic{flex:none}
.mh2-link{margin-top:10px;border:0;background:transparent;color:#cfe4f8;font-weight:700;font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:4px 0}
.ckdraw{width:46px;height:46px;flex:none}
.ckdraw circle{fill:rgba(63,193,133,.22);stroke:#3fc185;stroke-width:2.5;stroke-dasharray:140;stroke-dashoffset:140;animation:draw .6s ease-out forwards}
.ckdraw path{fill:none;stroke:#fff;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .4s .45s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* tombol sidik jari */
.fpw{margin-top:18px;display:flex;flex-direction:column;align-items:center;gap:10px}
.fpw-l{font-size:15px;font-weight:700;color:#fff;min-height:20px}
.fpb{position:relative;width:104px;height:104px;border-radius:50%;border:0;background:linear-gradient(160deg,#ffffff,#d9ecff);color:#0d2740;display:grid;place-items:center;box-shadow:0 14px 30px -12px rgba(0,0,0,.55);transition:transform .15s,background .3s;overflow:hidden;isolation:isolate}
.fpb:active{transform:scale(.94)}
.fpb.out{background:linear-gradient(160deg,#fff7e6,#ffe0a3);color:#8a5a00}
.fpb-ic{position:relative;z-index:2;display:grid}
.fpb-ring{position:absolute;inset:0;border-radius:50%;z-index:-1}
.fpw .fpb::before{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 0 rgba(255,255,255,.5);animation:fpPulse 2.2s infinite}
.fpw{position:relative}
.fpw::before,.fpw::after{content:"";position:absolute;top:0;left:50%;width:104px;height:104px;margin-left:-52px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);animation:fpWave 2.4s ease-out infinite;pointer-events:none}
.fpw::after{animation-delay:1.2s}
@keyframes fpWave{from{transform:scale(1);opacity:.9}to{transform:scale(1.6);opacity:0}}
@keyframes fpPulse{70%{box-shadow:0 0 0 0 transparent}}
.fpb-scan{position:absolute;left:12%;right:12%;height:3px;top:20%;border-radius:3px;background:linear-gradient(90deg,transparent,#2f7cc0,transparent);opacity:0;z-index:3}
.fpb.out .fpb-scan{background:linear-gradient(90deg,transparent,#c98a10,transparent)}
.fpb.scan .fpb-scan{opacity:1;animation:scanY .45s ease-in-out infinite alternate}
.fpb.scan .fpb-ic{animation:fpGlow .9s ease-in-out}
@keyframes fpGlow{50%{transform:scale(1.08)}}
.fpb.ok{background:linear-gradient(160deg,#d8f6e7,#9fe5c2);color:#0f7a4b}
.fpb.ok .fpb-ic{animation:pop .35s cubic-bezier(.2,.9,.25,1.3)}
.fpw:has(.fpb.scan)::before,.fpw:has(.fpb.scan)::after,.fpw:has(.fpb.ok)::before,.fpw:has(.fpb.ok)::after{animation:none;opacity:0}

/* cards */
.mc{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 2px rgba(13,39,64,.04),0 10px 24px -18px rgba(13,39,64,.25)}
.mc h4{font-size:15.5px;font-stretch:106%}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lnk{border:0;background:transparent;color:var(--brand);font-weight:700;font-size:13px;padding:2px 0}
.tl{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.tl-pt{display:flex;flex-direction:column;gap:2px;min-width:70px}
.tl-pt:last-child{text-align:right;align-items:flex-end}
.tl-pt i{width:12px;height:12px;border-radius:50%;background:var(--line);border:3px solid var(--surface);box-shadow:0 0 0 2px var(--line);margin-bottom:4px}
.tl-pt.on i{background:var(--good);box-shadow:0 0 0 2px var(--good)}
.tl-pt small{font-size:11.5px;color:var(--ink-3);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tl-pt b{font-family:var(--f-disp);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.tl-pt:not(.on) b{color:var(--ink-3)}
.tl-line{height:6px;border-radius:9px;background:var(--line-2);overflow:hidden}
.tl-line span{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--good),var(--brand-2));transform-origin:left;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wk-d{border:1px solid var(--line);background:var(--surface-2);border-radius:16px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .2s}
.wk-d:active{transform:scale(.94)}
.wk-d small{font-size:11px;color:var(--ink-3);font-weight:700}
.wk-d b{font-size:16px;font-variant-numeric:tabular-nums}
.wk-d i{font-style:normal;font-family:var(--f-mono);font-size:9.5px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);border-radius:6px;padding:0 4px;min-height:14px;line-height:14px}
.wk-d.fut{opacity:.6;border-style:dashed}
.wk-d.now{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);opacity:1;transform:translateY(-3px);box-shadow:0 10px 18px -10px var(--brand)}
.wk-d.now small{color:inherit;opacity:.8}
.wk-d.now i{background:rgba(255,255,255,.22);color:inherit}
.rot{flex-direction:row;align-items:center;gap:14px}
.ring2{width:76px;height:76px;flex:none;transform:rotate(-90deg)}
.ring2 circle{fill:none;stroke-width:7}
.ring2 .bg{stroke:var(--line-2)}
.ring2 .fg{stroke:var(--brand-2);stroke-linecap:round;stroke-dasharray:170;stroke-dashoffset:170;transition:stroke-dashoffset 1.3s cubic-bezier(.2,.8,.2,1)}
.rot-w{position:relative;flex:none}
.rot-c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.rot-c b{font-family:var(--f-disp);font-size:20px;font-weight:800}
.rot-c small{display:block;font-size:10.5px;color:var(--ink-3);font-weight:700}
.mst{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mst div{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:4px}
.mst b{font-family:var(--f-disp);font-size:24px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.mst small{font-size:11px;color:var(--ink-3);font-weight:600}
.mli{display:flex;gap:12px;align-items:center;padding:10px 0;border:0;border-bottom:1px solid var(--line-2);background:none;width:100%;text-align:left}
.mli:last-child{border-bottom:0}
.mli .cm{flex:1}
.mli img{width:34px;height:34px;border-radius:50%;object-fit:cover}
.mq2{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:18px;background:color-mix(in srgb,var(--warn) 13%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);animation:pop .4s}
.mq2 .cm{flex:1}
.mq2 .dot{width:10px;height:10px;border-radius:50%;background:var(--warn);animation:pulse 1.6s infinite;--c:var(--warn)}

/* bottom nav */
.mnav2{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:30;display:grid;grid-template-columns:repeat(var(--n),1fr);padding:6px;border-radius:24px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:0 18px 34px -18px rgba(13,39,64,.45)}
.mnav2-pill{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/var(--n));border-radius:18px;background:var(--brand-soft);transform:translateX(calc(var(--ix)*100%));transition:transform .45s cubic-bezier(.2,.9,.25,1.15)}
.mnav2 button{position:relative;z-index:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;font-size:11px;font-weight:700;color:var(--ink-3);transition:color .25s}
.mnav2 button .ic{transition:transform .35s cubic-bezier(.2,.9,.25,1.4)}
.mnav2 button.on{color:var(--brand)}
.mnav2 button.on .ic{transform:translateY(-1px) scale(1.12)}
.mnav2 em{position:absolute;top:2px;right:calc(50% - 22px);font-style:normal;background:var(--signal);color:#fff;border-radius:99px;font-size:10px;padding:0 5px;font-weight:800;animation:pop .4s}
.ma-fab{position:absolute;right:18px;bottom:96px;z-index:31;border:0;border-radius:20px;background:linear-gradient(160deg,var(--brand-2),var(--brand));color:#fff;display:flex;gap:8px;align-items:center;padding:15px 20px;font-weight:800;box-shadow:0 16px 28px -12px var(--brand);animation:pop .45s cubic-bezier(.2,.9,.25,1.3)}
.ma-fab:active{transform:scale(.95)}

/* calendar */
.mcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.mcal.slide-r{animation:slideR .35s}.mcal.slide-l{animation:slideLf .35s}
.mcal .wd{font-size:11px;text-align:center;color:var(--ink-3);font-weight:700;padding-bottom:2px}
.mcal .d{aspect-ratio:1;border-radius:12px;border:1px solid color-mix(in srgb,var(--c) 35%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:13px;font-weight:700;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--ink);padding:0;transition:transform .18s,box-shadow .2s}
.mcal .d small{font-family:var(--f-mono);font-size:8.5px;color:var(--c);font-weight:600}
.mcal .d.fut{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 12%,transparent) 0 4px,transparent 4px 8px);border-style:dashed}
.mcal .d.now{box-shadow:0 0 0 2px var(--signal)}
.mcal .d.sel{transform:scale(1.08);box-shadow:0 0 0 2px var(--brand),0 8px 16px -8px var(--brand);z-index:1}
.mcal .blank{aspect-ratio:1}
.mday{animation:pop .3s cubic-bezier(.2,.9,.25,1.1)}
.mday-h{display:flex;align-items:center;gap:12px}
.mday-badge{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:14px;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);border:1px solid color-mix(in srgb,var(--c) 35%,transparent)}
.mkv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.mkv div small{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-bottom:1px}
.mkv div{font-weight:600;font-size:14px;min-width:0;overflow-wrap:anywhere}

/* pengajuan */
.mseg{position:relative;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:4px}
.mseg-pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/4);border-radius:12px;background:var(--surface);box-shadow:var(--shadow);transform:translateX(calc(var(--ix)*100%));transition:transform .4s cubic-bezier(.2,.9,.25,1.15)}
.mseg button{position:relative;z-index:1;border:0;background:transparent;padding:8px 0;font-size:12.5px;font-weight:700;color:var(--ink-3)}
.mseg button.on{color:var(--ink)}
.pjc-h{display:flex;gap:12px;align-items:flex-start}
.pjc-ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.pjc-h .cm{flex:1}
.pjc-h .cm b{font-size:15.5px}
.pjt{display:grid;grid-template-columns:auto 1fr auto 1fr auto;align-items:center;gap:6px}
.pjt i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--line-2);color:var(--ink-3);font-style:normal}
.pjt i.ok{background:var(--good);color:#fff}
.pjt i.no{background:var(--crit);color:#fff}
.pjt i.wait{background:var(--warn);color:#fff;animation:pulse 1.6s infinite;--c:var(--warn)}
.pjt span{height:3px;border-radius:3px;background:var(--line-2)}
.pjt span.ok{background:var(--good)}
.pjt-l{display:grid;grid-template-columns:1fr 1fr 1fr;font-size:11px;color:var(--ink-3);font-weight:700}
.pjt-l span:nth-child(2){text-align:center}.pjt-l span:last-child{text-align:right}
.pj-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.pj-tile{border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;color:var(--ink-2);transition:all .2s}
.pj-tile .ic{color:var(--c)}
.pj-tile.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--ink);transform:translateY(-2px);box-shadow:0 10px 18px -12px var(--c)}
.mempty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:32px 16px;color:var(--ink-3)}
.mempty .bub{width:84px;height:84px;border-radius:28px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px) rotate(-3deg)}}

/* profil */
.mprof{align-items:center;text-align:center;padding:22px 16px;background:radial-gradient(100% 80% at 50% 0,var(--brand-soft),var(--surface) 70%)}
.mprof .av{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;font-size:28px;color:#fff;background:linear-gradient(150deg,var(--brand-2),var(--brand));box-shadow:0 0 0 5px var(--surface),0 0 0 7px var(--brand-2),0 18px 30px -14px var(--brand);animation:pop .5s cubic-bezier(.2,.9,.25,1.3)}
.mprof b{font-size:19px}
.mset{gap:0;padding:6px 16px}
.mset .mli{padding:13px 0}
.sw{width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;border:0;flex:none;transition:background .25s}
.sw.on{background:var(--good)}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .3s cubic-bezier(.2,.9,.25,1.3);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on i{transform:translateX(20px)}

/* login */
.ml{flex:1;overflow:auto;display:flex;flex-direction:column}
.ml-top{flex-shrink:0;position:relative;overflow:hidden;margin:4px 12px 0;border-radius:28px;padding:26px 20px 24px;color:#fff;text-align:center;background:radial-gradient(120% 90% at 100% 0,#2f7cc0 0,transparent 55%),linear-gradient(160deg,#0d2740,#1b5b95);isolation:isolate}
.ml-top h2{color:#fff;font-size:28px;font-weight:800;font-stretch:112%;margin-top:12px}
.ml-top p{margin:6px auto 0;max-width:28ch;color:rgba(255,255,255,.75);font-size:14px}
.ml-badge{width:78px;height:78px;margin:0 auto;border-radius:24px;display:grid;place-items:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);animation:pop .7s cubic-bezier(.2,.9,.25,1.3)}
.ml-orb{position:absolute;z-index:-1;width:240px;height:240px;left:-80px;bottom:-140px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 65%);animation:orb 7s ease-in-out infinite alternate}
.ml-body{flex-shrink:0;padding:16px 18px 24px;display:flex;flex-direction:column;gap:16px}
.ml-lbl{font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:6px;display:block}
.ml-accs{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 4px;scrollbar-width:none}
.ml-accs::-webkit-scrollbar{display:none}
.ml-acc{flex:none;display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:8px 12px 8px 8px;text-align:left;transition:all .2s}
.ml-acc .cm span{font-size:11.5px}
.ml-acc.on{border-color:var(--brand);background:var(--brand-soft);transform:translateY(-2px)}
.ml-dots{display:flex;gap:16px;justify-content:center;padding:6px 0}
.ml-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink-3);transition:all .2s}
.ml-dots i.on{background:var(--brand);border-color:var(--brand);transform:scale(1.15);animation:pop .25s}
.ml-dots.bad{animation:shake .4s}.ml-dots.bad i{border-color:var(--crit);background:transparent}
.ml-dots.good i{background:var(--good);border-color:var(--good)}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.ml-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}

 const r={job:j,est:0,ap:0,inv:0,apN:0};ts.forEach(t=>{const v=revT(t),s=tState(t);if(s==='Estimasi')r.est+=v;else if(s==='Disetujui'){r.ap+=v;r.apN++}else r.inv+=v});return r})}

let ABS_IX={};
function absIdx(){const m={};DB.absensi.forEach(a=>m[a.nik+'|'+a.tgl]=a);return m}
function stateOn(e,d){const r=ABS_IX[e.nik+'|'+d];return r?r.kode:planOn(e,d)}
function nextChange(e){return null;if(e.statusKerja==='Nonaktif')return null;if(e.rotasi==='5/2')return {label:'Senin–Jumat di base'};
 const cur=planOn(e,TODAY)==='OFF';for(let i=1;i<=70;i++){const d=add(TODAY,i);if((planOn(e,d)==='OFF')!==cur)return {d,days:i,label:cur?`Kembali ${fDs(d)} (${i} hari)`:`Off mulai ${fDs(d)} (${i} hari)`}}return null}
function hrStrip(e,from,n,lg){let h='';for(let i=0;i<n;i++){const d=add(from,i),s=stateOn(e,d);h+=`<span style="--c:var(${s?ABS[s].v:'--line'});${d>TODAY?'opacity:.4;':''}${d===TODAY?'outline:2px solid var(--signal);outline-offset:1px;':''}" title="${fDs(d)} · ${s?ABS[s].n:'–'}"></span>`}return `<div class="strip${lg?' lg':''}">${h}</div>`}
function crewOf(j){return DB.karyawan.filter(e=>e.job===j.no&&e.statusKerja!=='Nonaktif')}
function crewStat(j){const cs=crewOf(j),on=cs.filter(e=>stateOn(e,TODAY)==='OL'),tv=cs.filter(e=>stateOn(e,TODAY)==='TV'),off=cs.filter(e=>['OFF','BS'].includes(stateOn(e,TODAY)));
 const ch=on.concat(tv).map(nextChange).filter(x=>x&&x.days).sort((a,b)=>a.days-b.days)[0];return {cs,on,tv,off,ch}}

function syncKat(){if(!DB.kategori)return;Object.keys(KAT).forEach(k=>delete KAT[k]);DB.kategori.forEach(x=>KAT[x.kode]=x.nama)}
function ensureKat(){if(!DB.kategori){const D={SEP:'Memisahkan aliran sumur menjadi minyak, gas, dan air untuk diukur. Wajib uji hidrostatik dan PSV terkalibrasi.',CMF:'Mengatur laju aliran dan tekanan sumur sebelum masuk separator.',SHE:'Memanaskan aliran sumur untuk mencegah hidrat dan menurunkan viskositas.',SGT:'Menampung dan mengukur volume cairan setelah separator.',BRN:'Membakar gas dan minyak hasil uji secara aman di lokasi.',DAQ:'Merekam data tekanan, suhu, dan laju alir secara real time.',ESD:'Menutup aliran sumur otomatis saat kondisi darurat.',PIP:'Pipa, sambungan, dan fitting penghubung antar peralatan uji.'};
 DB.kategori=Object.entries(KAT).map(([kode,nama],i)=>({kode,nama,keterangan:D[kode]||'',dibuat:`2025-01-0${1+i}T08:00:00`}));persist()}
 if(!DB.rakv){const conv=o=>{if(!o||!Array.isArray(o.rAlat)||!o.rAlat.some(x=>x.alat))return;const g={},keep=o.rAlat.filter(x=>x.kat);o.rAlat.filter(x=>x.alat).forEach(x=>{const kt=aOf(x.alat)?.kategori;if(!kt||keep.some(y=>y.kat===kt))return;(g[kt]=g[kt]||[]).push(x)});o.rAlat=keep.concat(Object.entries(g).map(([kt,L])=>{const m=c=>Math.round(L.reduce((a,x)=>a+(+x[c]||0),0)/L.length/50000)*50000;return {kat:kt,op:m('op'),sb:m('sb'),md:m('md'),bd:m('bd')}}))};DB.kontrak.forEach(conv);DB.job.forEach(conv);DB.rakv=1;persist()}
 if(!DB.notv){(DB.absensi||[]).forEach(a=>{if(a.kode==='TV')a.kode='OL'});DB.notv=1;persist()}
 if(!DB.depkv){DB.alat.forEach(a=>{if(a.depKel===undefined){a.depKel='K3';a.depMetode='Garis lurus';a.depPeriode='Tahunan';a.depSatuan='Persen';a.depNilai=6.25}});DB.depkv=1;persist()}
 DB.alat.forEach(a=>{if(a.kategori&&!DB.kategori.some(x=>x.kode===a.kategori)){DB.kategori.push({kode:a.kategori,nama:a.kategori,keterangan:'',dibuat:stamp()})}});syncKat()}

function mSite(nama,full){if(SITES[nama])return SITES[nama];let h=0;for(const c of nama)h=(h*31+c.charCodeAt(0))%100000;return {lat:-6+(h%900)/100,lng:100+(h%1700)/100,alamat:full||nama}}
const hav=(a,b)=>{const R=6371,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dg=r(b.lng-a.lng),s=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(s))};

function mGps(cb){const e=mMe(),tk=MF.tok;let done=false;

  fin({nama,alamat:s.alamat,lat:s.lat+((k%9)-4)/10000,lng:s.lng+((k%7)-3)/10000,akurasi:5+(k%11),area:true,sim:true})};
 if(!navigator.geolocation){setTimeout(sim,RM()?200:1300);return}
 const to=setTimeout(sim,6000);
 try{navigator.geolocation.getCurrentPosition(p=>{clearTimeout(to);const g={lat:p.coords.latitude,lng:p.coords.longitude,akurasi:Math.round(p.coords.accuracy||10)};
   let best=null,d=1e9;Object.entries(SITES).forEach(([n,s])=>{const x=hav(g,s);if(x<d){d=x;best=n}});
   fin(d<=5?{...g,nama:best,alamat:SITES[best].alamat,area:true}:{...g,nama:'Di luar area kerja',alamat:`Titik GPS ${fmtLL(g)}, ${Math.round(d)} km dari ${best}`,area:false})},
